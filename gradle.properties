# Project-wide Gradle settings.

#########################################
# JVM args
#########################################
org.gradle.jvmargs=-XX:+UseG1GC -XX:SoftRefLRUPolicyMSPerMB=1 -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Xmx2g -Xms1g
kotlin.daemon.jvmargs=-XX:+UseG1GC -XX:SoftRefLRUPolicyMSPerMB=1 -XX:ReservedCodeCacheSize=320m -XX:+HeapDumpOnOutOfMemoryError -Xmx2g -Xms1g
# Read by :app and applied to unit test worker JVMs.
org.gradle.testWorker.jvmargs=-Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:SoftRefLRUPolicyMSPerMB=1 -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError -Xmx512m -Xms256m

#########################################
# Gradle performance
#########################################
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.vfs.watch=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
# Isolated projects: the only plugins left are AGP, KGP, the Compose compiler and kotlinx
# serialization, none of which reach across projects. If a future plugin does, turn this off.
org.gradle.unsafe.isolated-projects=true

#########################################
# Android
#########################################
android.useAndroidX=true
android.uniquePackageNames=true
android.nonTransitiveRClass=true
android.lint.useK2Uast=true
android.r8.maxWorkers=2
android.suppressUnsupportedOptionWarnings=android.suppressUnsupportedOptionWarnings,\
  android.lint.useK2Uast,\
  android.r8.maxWorkers
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false

#########################################
# Kotlin
#########################################
kotlin.code.style=official
kotlin.incremental=true
kotlin.compiler.execution.strategy=daemon
