[versions]
build-android-compileSdk = "37"
build-android-minSdk = "27"
# Keep targetSdk at 36 on purpose. At targetSdk 37 Android 17 requires the ACCESS_LOCAL_NETWORK
# runtime permission for the app's LAN WebSocket and NSD discovery. Do not bump without adding it.
build-android-targetSdk = "36"
# Toolchain compatibility: Kotlin Gradle Plugin 2.4.21 is documented as fully tested only up to
# Gradle 9.7.0 / AGP 9.3.1. Gradle 9.8.1 + AGP 9.4.0 + Kotlin 2.4.21 is the chosen "latest" set
# and may print KGP compatibility warnings. Conservative fallback set: Gradle 9.7.1, AGP 9.3.3,
# Kotlin 2.4.21 (Gradle version lives in gradle/wrapper/gradle-wrapper.properties).
build-android-agp = "9.4.0"
build-kotlin = "2.4.21"
build-kotlin-language = "2.4"
build-kotlin-coroutines = "1.11.0"
build-java-asm = "9.11.1"
# JDK 21 (an LTS) is deliberate; JDK 25 with Kotlin 2.4 jvmTarget is unverified.
build-java-target = "21"
androidx-core = "1.19.1"
androidx-activity-compose = "1.13.0"
androidx-compose-bom = "2026.09.00"
androidx-lifecycle = "2.11.0"
okhttp = "5.5.0"
kotlinx-serialization = "1.11.0"
test-junit = "4.13.2"

[plugins]
android-application = { id = "com.android.application", version.ref = "build-android-agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "build-kotlin" }

[libraries]
# Gradle plugins as libraries, used only by the root buildscript classpath to pin KGP/AGP.
kgp = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "build-kotlin" }
agp = { module = "com.android.tools.build:gradle", version.ref = "build-android-agp" }

asm-bom = { module = "org.ow2.asm:asm-bom", version.ref = "build-java-asm" }

kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "build-kotlin-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "build-kotlin-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
# OkHttp 5 API (package mockwebserver3).
okhttp-mockwebserver3 = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }

androidx-core = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "androidx-compose-bom" }
compose-ui-core = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material = { group = "androidx.compose.material3", name = "material3" }

junit = { module = "junit:junit", version.ref = "test-junit" }
